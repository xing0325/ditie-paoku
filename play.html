import * as THREE from 'three';
// ===== src/corpses.js =====
// 一具瘫软的尸体(低面):横躺的身体 + 偏置的头
function crumpled(toon, color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.42, 1.0), toon(color));
  body.position.y = 0.21; g.add(body);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), toon(color));
  head.position.set(0.55, 0.2, 0.12); g.add(head);
  return g;
}

// 尸堆系统:① 散落地面、随世界滚动回收的尸体 ② 车头逐渐堆高的"尸体排障器"
function createCorpses(scene, toon, trainGroup) {
  const ground = [];
  const pool = [];
  const pile = new THREE.Group();
  pile.position.set(0, 0, -2.9);   // 挂在车头,随车一起切道
  trainGroup.add(pile);
  let pileN = 0;
  const PILE_MAX = 16;

  function addGround(x, z) {
    const c = pool.pop() || crumpled(toon, 0x8f9298);
    c.visible = true;
    c.position.set(x, 0, z);
    c.rotation.y = Math.random() * Math.PI * 2;
    scene.add(c);
    ground.push(c);
  }

  function bumpPile() {
    if (pileN >= PILE_MAX) return;
    const b = crumpled(toon, 0x86898f);
    b.position.set((Math.random() - 0.5) * 2.6, 0.3 + Math.random() * 1.8, (Math.random() - 0.5) * 1.1);
    b.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
    b.scale.setScalar(0.78);
    pile.add(b);
    pileN++;
  }

  function update(speed) {
    for (let i = ground.length - 1; i >= 0; i--) {
      const c = ground[i];
      c.position.z += speed;
      if (c.position.z > 14) {
        c.visible = false; scene.remove(c); pool.push(c); ground.splice(i, 1);
      }
    }
  }

  function reset() {
    for (const c of ground.splice(0)) { c.visible = false; scene.remove(c); pool.push(c); }
    for (const b of [...pile.children]) pile.remove(b);
    pileN = 0;
  }

  return { addGround, bumpPile, update, reset, get pileN() { return pileN; } };
}

// ===== src/environment.js =====
// 环境氛围:钢轨 + 滚动站台灯(暖色光斑)+ 远侧暗柱。把"工地"变成"夜里的地铁"。
function createEnvironment(scene, toon) {
  const group = new THREE.Group();
  scene.add(group);

  // 钢轨:每条车道两条,静态长条
  const railMat = toon(0x575d66);
  for (let i = 0; i < LANE_COUNT; i++) {
    for (const dx of [-0.7, 0.7]) {
      const r = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 320), railMat);
      r.position.set(laneX(i) + dx, 0.09, -130);
      group.add(r);
    }
  }

  const SIDE = (LANE_COUNT * 4) / 2 + 2.4;

  // 站台灯柱(滚动回收)+ 地面暖色光斑(加色混合的扁圆,廉价又出氛围,不用真光源)
  const lamps = [];
  const LSPAN = 9, LSTEP = 24;
  const poolMat = new THREE.MeshBasicMaterial({
    color: 0xff9a3c, transparent: true, opacity: 0.20,
    depthWrite: false, blending: THREE.AdditiveBlending,
  });
  for (let i = 0; i < LSPAN; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const lamp = new THREE.Group();
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 5.4, 0.22), toon(0x14171e));
    post.position.y = 2.7; lamp.add(post);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.18, 0.18), toon(0x14171e));
    arm.position.set(-side * 0.75, 5.1, 0); lamp.add(arm);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 0.5),
      new THREE.MeshBasicMaterial({ color: 0xffd089 }));
    head.position.set(-side * 1.4, 5.0, 0); lamp.add(head);
    const pool = new THREE.Mesh(new THREE.CircleGeometry(3.4, 18), poolMat);
    pool.rotation.x = -Math.PI / 2;
    pool.position.set(-side * 1.4, 0.06, 0); lamp.add(pool);
    lamp.position.set(side * SIDE, 0, -i * LSTEP);
    group.add(lamp); lamps.push(lamp);
  }

  // 远侧暗柱:隧道/站台结构感,滚动回收
  const pillars = [];
  const PSPAN = 12, PSTEP = 15, PSIDE = SIDE + 3.8;
  const pillarMat = toon(0x0f1218);
  for (let i = 0; i < PSPAN; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const p = new THREE.Mesh(new THREE.BoxGeometry(1.4, 9.5, 1.4), pillarMat);
    p.position.set(side * PSIDE, 4.75, -i * PSTEP);
    group.add(p); pillars.push(p);
  }

  function update(speed) {
    for (const l of lamps) { l.position.z += speed; if (l.position.z > 14) l.position.z -= LSPAN * LSTEP; }
    for (const p of pillars) { p.position.z += speed; if (p.position.z > 16) p.position.z -= PSPAN * PSTEP; }
  }

  return { update };
}

// ===== src/feedback.js =====
// 撞击反馈:镜头震 + 冻帧(hit-stop)+ 慢动作 + 抛飞布娃娃 + 血粒子(随血腥度模式)
function createFeedback(camera, scene, toon, getGore) {
  let shake = 0;
  const base = camera.position.clone();
  const flying = [];     // 被撞飞的小人
  const bits = [];       // 血粒子
  const bitPool = [];
  let hitstop = 0;       // 冻帧计数
  let slow = 1;          // 慢动作因子(缓回 1)

  function bloodBit() {
    return bitPool.pop()
      || new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18),
                        new THREE.MeshBasicMaterial({ color: 0xc0241f }));
  }

  function spawnBlood(pos, mode) {
    const n = mode === 'realistic' ? 16 : 7;
    const col = mode === 'realistic' ? 0x6b0d10 : 0xc0241f;
    const scl = mode === 'realistic' ? 0.8 : 1.2;
    const life = mode === 'realistic' ? 64 : 34;
    for (let i = 0; i < n; i++) {
      const m = bloodBit();
      m.material.color.setHex(col);
      m.scale.setScalar(scl * (0.5 + Math.random()));
      m.position.copy(pos).add(new THREE.Vector3((Math.random() - 0.5) * 0.8, 1.0 + Math.random() * 0.6, 0));
      m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 0.5, 0.25 + Math.random() * 0.45, 0.12 + Math.random() * 0.3);
      m.userData.life = life;
      m.visible = true; scene.add(m); bits.push(m);
    }
  }

  return {
    hit(mesh) {
      shake = Math.min(1.0, shake + 0.32);
      hitstop = Math.max(hitstop, 3);
      slow = 0.32;
      mesh.userData.vel = new THREE.Vector3((Math.random() - 0.5) * 0.45, 0.42, 0.32);
      mesh.userData.spin = (Math.random() - 0.5) * 0.6;
      flying.push(mesh);
      spawnBlood(mesh.position, getGore ? getGore() : 'stylized');
    },
    // 每帧调一次:冻帧时近乎停住,之后从慢动作缓回正常
    timeScale() {
      if (hitstop > 0) { hitstop--; return 0.05; }
      slow += (1 - slow) * 0.1;
      return slow;
    },
    update() {
      camera.position.set(
        base.x + (Math.random() - 0.5) * shake,
        base.y + (Math.random() - 0.5) * shake,
        base.z + (Math.random() - 0.5) * shake * 0.5);
      shake *= 0.84; if (shake < 0.01) { shake = 0; camera.position.copy(base); }

      for (let i = flying.length - 1; i >= 0; i--) {
        const m = flying[i];
        m.userData.vel.y -= 0.03;
        m.position.add(m.userData.vel);
        m.rotation.z += m.userData.spin; m.rotation.x += m.userData.spin * 0.5;
        if (m.position.y < -2) { scene.remove(m); flying.splice(i, 1); }
      }
      for (let i = bits.length - 1; i >= 0; i--) {
        const m = bits[i];
        m.userData.v.y -= 0.025;
        m.position.add(m.userData.v);
        if (m.position.y < 0.05) { m.position.y = 0.05; m.userData.v.set(0, 0, 0); }
        if (--m.userData.life <= 0) { m.visible = false; scene.remove(m); bitPool.push(m); bits.splice(i, 1); }
      }
    },
    reset() {
      for (const m of flying.splice(0)) scene.remove(m);
      for (const m of bits.splice(0)) { m.visible = false; scene.remove(m); bitPool.push(m); }
      shake = 0; hitstop = 0; slow = 1; camera.position.copy(base);
    },
  };
}

// ===== src/hud.js =====
function createHUD() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;pointer-events:none;color:#cdd0d6;'
    + 'font:16px ui-monospace,monospace';
  wrap.innerHTML = `
    <div style="position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 78% 78% at 50% 44%, transparent 56%, #000000bb 100%)"></div>
    <div style="position:absolute;top:16px;left:18px" id="dist">距离 0 m</div>
    <div style="position:absolute;top:16px;right:18px;color:#8b9098" id="kills">碾过 0</div>
    <div id="card" style="position:absolute;inset:0;display:none;align-items:center;
      justify-content:center;flex-direction:column;gap:14px;background:#0e1014cc;
      pointer-events:auto;text-align:center">
      <div style="font-style:italic;color:#aeb2ba">这趟到此为止。下一趟照常发车。</div>
      <div id="cardstats" style="color:#8b9098"></div>
      <div style="color:#6b7078;font-size:13px">点击 / 按任意键 重开</div>
    </div>
    <div id="sub" style="position:absolute;left:0;right:0;bottom:54px;text-align:center;
      font:italic 16px Georgia,'Songti SC',serif;color:#aeb2ba;opacity:0;transition:opacity .6s;
      text-shadow:0 1px 4px #000;padding:0 24px"></div>`;
  document.body.appendChild(wrap);
  const $ = (id) => wrap.querySelector('#' + id);
  let subT = null;
  return {
    say(text) {
      const el = $('sub');
      el.textContent = text;
      el.style.opacity = '1';
      clearTimeout(subT);
      subT = setTimeout(() => { el.style.opacity = '0'; }, 3800);
    },
    set(distance, kills) {
      $('dist').textContent = `距离 ${distance} m`;
      $('kills').textContent = `碾过 ${kills}`;
    },
    showCard(distance, kills) {
      $('cardstats').textContent = `距离 ${distance} m · 碾过 ${kills}`;
      $('card').style.display = 'flex';
    },
    hideCard() { $('card').style.display = 'none'; },
  };
}

// ===== src/input.js =====
function attachInput(onSteer) {   // onSteer(-1 | +1)
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') onSteer(-1);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') onSteer(1);
  });
  let sx = 0;
  addEventListener('touchstart', (e) => { sx = e.changedTouches[0].clientX; }, { passive: true });
  addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 30) onSteer(dx > 0 ? 1 : -1);
  }, { passive: true });
}

// ===== src/logic/collision.js =====
function overlaps(trainLane, trainZ, entLane, entZ, zTol) {
  return trainLane === entLane && Math.abs(trainZ - entZ) <= zTol;
}

// ===== src/logic/difficulty.js =====
const BASE_SPEED = 0.34;   // 世界单位 / 帧 @60fps
const MAX_SPEED = 0.9;
const RAMP = 0.00006;             // 每米加速度
function speedAt(distance) {
  return Math.min(MAX_SPEED, BASE_SPEED + Math.max(0, distance) * RAMP);
}

// ===== src/logic/gameState.js =====
function createGame() {
  return {
    state: 'running',
    derail() { if (this.state === 'running') this.state = 'dead'; },
    reset() { this.state = 'running'; },
  };
}

// ===== src/logic/lanes.js =====
const LANE_COUNT = 3;
const LANE_GAP = 4;              // 相邻车道 x 间距
function laneX(i) { return (i - 1) * LANE_GAP; }
function clampLane(i) { return Math.max(0, Math.min(LANE_COUNT - 1, i)); }
function nextLane(current, dir) { return clampLane(current + Math.sign(dir)); }

// ===== src/logic/narrator.js =====
// 冷面旁白:跨越里程碑时吐一句平淡的话,否则沉默。纯逻辑,可 Node 测试。
const KILL_LINES = [
  [1, '第一个。系统未记录姓名。'],
  [10, '它不会停,也不会等你。'],
  [50, '前方依然没有目的地。'],
  [100, '第 100 个。无人认领。'],
  [250, '数字不再有意义。'],
  [500, '你早就停不下来了。'],
];
const DIST_LINES = [
  [400, '没有站台,没有终点。'],
  [1200, '里程在涨。意义没有。'],
  [3000, '它还在开。你也是。'],
];

function createNarrator() {
  const fired = new Set();
  function pick(table, value, prefix) {
    for (const [thr, line] of table) {
      const key = prefix + thr;
      if (value >= thr && !fired.has(key)) { fired.add(key); return line; }
    }
    return null;
  }
  return {
    // 碾压里程碑优先于距离里程碑;每条只触发一次;无事返回 null
    update({ distance, kills }) {
      return pick(KILL_LINES, kills, 'k') ?? pick(DIST_LINES, distance, 'd');
    },
    reset() { fired.clear(); },
  };
}

// ===== src/logic/scoring.js =====
function createScore() {
  let raw = 0;
  return {
    distance: 0, kills: 0,
    advance(d) { raw += d; this.distance = Math.floor(raw); },
    kill() { this.kills += 1; },
  };
}

// ===== src/logic/settings.js =====
// 极简设置:血腥度模式(风格化 / 写实),注入 storage 以便测试与持久化。
const VALID = ['stylized', 'realistic'];

function createSettings(storage) {
  let mode = storage?.getItem?.('gore');
  if (!VALID.includes(mode)) mode = 'stylized';
  return {
    get gore() { return mode; },
    cycle() {
      mode = mode === 'stylized' ? 'realistic' : 'stylized';
      storage?.setItem?.('gore', mode);
      return mode;
    },
  };
}

// ===== src/logic/spawner.js =====
function createSpawner({ gap, obstacleEvery, rng }) {
  let acc = 0, count = 0;
  return {
    update(distanceDelta) {
      acc += distanceDelta;
      if (acc < gap) return null;
      acc -= gap;
      count += 1;
      const lane = Math.floor(rng() * 3) % 3;
      const type = count % obstacleEvery === 0 ? 'obstacle' : 'person';
      return { lane, type };
    },
  };
}

// ===== src/obstacleView.js =====
function makeObstacle(toon) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.2, 1.4), toon(0x55585f));
  m.position.y = 1.1;
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
    new THREE.LineBasicMaterial({ color: 0x15171c }));
  m.add(e);
  return m;
}

// ===== src/scene.js =====
function createScene(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const scene = new THREE.Scene();
  // 冷夜地铁:近黑冷蓝底 + 同色雾做纵深递退
  const cold = 0x0a0d14;
  scene.background = new THREE.Color(cold);
  scene.fog = new THREE.Fog(cold, 22, 80);

  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 220);
  camera.position.set(0, 5.2, 9.5);
  camera.lookAt(0, 1.2, -12);

  // 灯光:冷月光主光 + 半球环境(冷天蓝顶 / 暗地)+ 一抹钠灯暖补光
  const hemi = new THREE.HemisphereLight(0x36425e, 0x090a0d, 0.6);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xbcd0ff, 0.9);
  key.position.set(-8, 16, 6); scene.add(key);
  const warm = new THREE.DirectionalLight(0xffb060, 0.3);
  warm.position.set(7, 3, 11); scene.add(warm);

  // 三渲二阶梯渐变:暗部压深、冷,四档
  const g = new Uint8Array([38, 90, 150, 230]);
  const gradMap = new THREE.DataTexture(g, g.length, 1, THREE.RedFormat);
  gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter;
  gradMap.needsUpdate = true;
  const toon = (color) => new THREE.MeshToonMaterial({ color, gradientMap: gradMap });

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  return { renderer, scene, camera, toon, resize };
}

// ===== src/track.js =====
function createTrack(scene, toon) {
  const group = new THREE.Group();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(LANE_COUNT * 4 + 4, 260), toon(0x24262c));
  ground.rotation.x = -Math.PI / 2; ground.position.z = -110;
  group.add(ground);

  // 车道分隔线
  for (let i = 0; i <= LANE_COUNT; i++) {
    const x = laneX(0) - 2 + i * 4;
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.06, 260), toon(0x3a3d44));
    line.position.set(x, 0.04, -110); group.add(line);
  }
  // 轨枕(滚动回收)
  const sleepers = [];
  const SPAN = 30, STEP = 5;
  for (let i = 0; i < SPAN; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(LANE_COUNT * 4 + 2, 0.2, 0.55), toon(0x33363d));
    s.position.set(0, 0.06, -i * STEP); group.add(s); sleepers.push(s);
  }
  scene.add(group);

  function update(speed) {
    for (const s of sleepers) {
      s.position.z += speed;
      if (s.position.z > 12) s.position.z -= SPAN * STEP;
    }
  }
  return { update };
}

// ===== src/trainView.js =====
// 钝铁块无脸地铁:冷钢两色 + 暗赭腰线;前脸暖灯眼 + 排障器,车尾红灯(玩家主要看到车尾+车顶)
function createTrain(scene, toon) {
  const train = new THREE.Group();
  const STEEL = 0x49515d, STEEL_TOP = 0x59626e, ACCENT = 0xc98a3a, DARK = 0x0c0f14;

  const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.2, 5.2), toon(STEEL));
  body.position.y = 1.4; train.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.5, 5.0), toon(STEEL_TOP));
  roof.position.y = 2.65; train.add(roof);

  // 侧腰线(暗赭强调)
  for (const sx of [-1.61, 1.61]) {
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.34, 5.0), toon(ACCENT));
    stripe.position.set(sx, 1.55, 0); train.add(stripe);
  }
  // 车顶空调(低面细节)
  for (const dz of [-1.4, 0.4]) {
    const ac = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.32, 1.1), toon(0x3a414b));
    ac.position.set(0, 2.96, dz); train.add(ac);
  }

  // 前脸(朝前 -z,迎向被碾的人):挡风玻璃 + 暖灯眼 + 排障器
  const ws = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.95, 0.18), toon(DARK));
  ws.position.set(0, 1.95, -2.62); train.add(ws);
  for (const sx of [-0.85, 0.85]) {
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.34, 0.16),
      new THREE.MeshBasicMaterial({ color: 0xfff1c0 }));
    eye.position.set(sx, 0.95, -2.64); train.add(eye);
  }
  const plow = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.7, 0.55), toon(0x2b3037));
  plow.position.set(0, 0.5, -2.7); train.add(plow);

  // 车尾(朝向相机 +z):尾窗 + 两盏红灯
  const rw = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 0.18), toon(DARK));
  rw.position.set(0, 1.95, 2.62); train.add(rw);
  for (const sx of [-0.9, 0.9]) {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.28, 0.16),
      new THREE.MeshBasicMaterial({ color: 0xc0241f }));
    tl.position.set(sx, 1.0, 2.64); train.add(tl);
  }

  // 描边(主车身,三渲二)
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(body.geometry), new THREE.LineBasicMaterial({ color: 0x090b0f }));
  edges.position.copy(body.position); train.add(edges);

  train.position.set(laneX(1), 0, 2);
  scene.add(train);

  let lane = 1, targetX = laneX(1);
  return {
    group: train,
    get lane() { return lane; },
    get z() { return train.position.z; },
    setLane(i) { lane = i; targetX = laneX(i); },
    update() {
      train.position.x += (targetX - train.position.x) * 0.25;     // 补间
      train.rotation.y = (targetX - train.position.x) * -0.08;     // 切轨倾斜
    },
  };
}

// ===== src/victimView.js =====
const COATS = [0x5b6470, 0x6b5d52, 0x4f5a52, 0x6a5563, 0x566070, 0x615a4e];
function makePerson(toon) {
  const g = new THREE.Group();
  const coat = COATS[(Math.random() * COATS.length) | 0];
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.5), toon(coat));
  torso.position.y = 1.05; g.add(torso);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.46, 0.42), toon(0xc1a386));
  head.position.y = 1.92; g.add(head);
  for (const sx of [-0.18, 0.18]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.7, 0.3), toon(0x2f343c));
    leg.position.set(sx, 0.35, 0); g.add(leg);
  }
  for (const sx of [-0.46, 0.46]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.9, 0.24), toon(coat));
    arm.position.set(sx, 1.05, 0); g.add(arm);
  }
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(torso.geometry),
    new THREE.LineBasicMaterial({ color: 0x14171c }));
  e.position.copy(torso.position); g.add(e);
  return g;
}

function createEntities(scene, toon) {
  const SPAWN_Z = -120;
  const active = [];                 // {mesh, lane, type}
  const pool = { person: [], obstacle: [] };

  function obtain(type) {
    const m = pool[type].pop() || (type === 'person' ? makePerson(toon) : makeObstacle(toon));
    m.visible = true; scene.add(m); return m;
  }
  function recycle(item) {
    item.mesh.visible = false; scene.remove(item.mesh);
    pool[item.type].push(item.mesh);
  }

  return {
    active,
    spawn(type, lane) {
      const mesh = obtain(type);
      const baseY = type === 'person' ? 0 : 1.1;
      mesh.position.set(laneX(lane), baseY, SPAWN_Z);
      active.push({ mesh, lane, type });
    },
    update(speed) {
      for (let i = active.length - 1; i >= 0; i--) {
        const it = active[i];
        it.mesh.position.z += speed;
        if (it.mesh.position.z > 14) { recycle(it); active.splice(i, 1); }
      }
    },
    kill(item) {                       // 从 active 移除,但不回收(交给 feedback 抛飞)
      const idx = active.indexOf(item);
      if (idx >= 0) active.splice(idx, 1);
    },
    reset() {                          // 清空当前局所有 active,回池
      for (const it of active.splice(0)) {
        it.mesh.visible = false; scene.remove(it.mesh); pool[it.type].push(it.mesh);
      }
    },
  };
}

// ===== src/main.js =====
const canvas = document.getElementById('c');
const { renderer, scene, camera, toon } = createScene(canvas);
const track = createTrack(scene, toon);
const environment = createEnvironment(scene, toon);
const train = createTrain(scene, toon);
const entities = createEntities(scene, toon);
const settings = createSettings(typeof localStorage !== 'undefined' ? localStorage : null);
const feedback = createFeedback(camera, scene, toon, () => settings.gore);
const corpses = createCorpses(scene, toon, train.group);
const hud = createHUD();

const Z_TOL = 1.6;

let spawner, score, game, narrator;
function newRun() {
  spawner = createSpawner({ gap: 9, obstacleEvery: 6, rng: Math.random });
  score = createScore();
  game = createGame();
  narrator = createNarrator();
}
newRun();

attachInput((dir) => {
  if (game.state === 'running') train.setLane(nextLane(train.lane, dir));
});

function restart() {
  if (game.state !== 'dead') return;
  entities.reset();
  corpses.reset();
  feedback.reset();
  train.setLane(1);
  newRun();
  hud.hideCard();
}
addEventListener('keydown', () => restart());
addEventListener('click', () => restart());

addEventListener('keydown', (e) => {
  if (e.key === 'b' || e.key === 'B') {
    const mode = settings.cycle();
    hud.say(mode === 'realistic' ? '血腥度:写实' : '血腥度:风格化');
  }
});

function step() {
  if (game.state !== 'running') return;
  const speed = speedAt(score.distance) * feedback.timeScale();
  score.advance(speed);
  const ev = spawner.update(speed);
  if (ev) entities.spawn(ev.type, ev.lane);
  track.update(speed);
  environment.update(speed);
  train.update();
  entities.update(speed);
  corpses.update(speed);

  for (const it of [...entities.active]) {
    if (!overlaps(train.lane, train.z, it.lane, it.mesh.position.z, Z_TOL)) continue;
    if (it.type === 'person') {
      entities.kill(it); feedback.hit(it.mesh); score.kill();
      corpses.addGround(it.mesh.position.x, it.mesh.position.z); corpses.bumpPile();
    } else { game.derail(); hud.showCard(score.distance, score.kills); }
  }
  const line = narrator.update({ distance: score.distance, kills: score.kills });
  if (line) hud.say(line);
  feedback.update();
  hud.set(score.distance, score.kills);
}

function frame() {
  requestAnimationFrame(frame);
  step();
  renderer.render(scene, camera);
}
frame();
window.__ditie = { train, entities, corpses, settings, feedback, step, getScore: () => score, getGame: () => game };
console.log('[ditie] phase2 ok');
</script>
